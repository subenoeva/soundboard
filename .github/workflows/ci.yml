name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libgl1 libdbus-1-3
      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: astral-sh/setup-uv@v5
        # Before `uv sync`, which would quietly rewrite a stale lockfile instead of
        # reporting it. Both 0.4.0 and 0.4.1 shipped with uv.lock pinning the previous
        # version, and nothing anywhere said so.
      - run: uv lock --check
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest -v
      - name: Run tests (non-Linux)
        if: runner.os != 'Linux'
        run: uv run pytest -v

  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libgl1 libdbus-1-3
      - uses: astral-sh/setup-uv@v5
      - uses: supabase/setup-cli@v1
        with:
          # Pinned instead of "latest": that setting makes the action resolve the
          # newest release through GitHub's API, which is easy to bounce off the
          # unauthenticated rate limit on a shared runner IP (as happened here).
          version: 2.110.0
      - run: supabase start
      - run: uv sync --group dev
      - run: uv run pytest tests/integration/test_rls.py -m supabase -v
      - run: supabase stop
