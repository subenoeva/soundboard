name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libgl1 libdbus-1-3
      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest -v
      - name: Run tests (non-Linux)
        if: runner.os != 'Linux'
        run: uv run pytest -v

  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: uv sync --group dev
      - run: uv run pytest tests/integration/test_rls.py -m supabase -v
      - run: supabase stop
