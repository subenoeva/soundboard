name: release-build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group packaging
      - name: Bake Supabase config
        shell: python
        env:
          SOUNDBOARD_SUPABASE_URL: ${{ secrets.SOUNDBOARD_SUPABASE_URL }}
          SOUNDBOARD_SUPABASE_ANON_KEY: ${{ secrets.SOUNDBOARD_SUPABASE_ANON_KEY }}
        run: |
          import os
          from pathlib import Path

          url = os.environ["SOUNDBOARD_SUPABASE_URL"]
          key = os.environ["SOUNDBOARD_SUPABASE_ANON_KEY"]
          Path("src/soundboard/_baked_defaults.py").write_text(
              f"SUPABASE_URL = {url!r}\nSUPABASE_ANON_KEY = {key!r}\n"
          )
      - run: uv run pyinstaller packaging/windows/soundboard.spec
      - name: Rename artifact to the release asset name
        shell: bash
        run: mv dist/soundboard.exe "soundboard-${{ env.TAG }}-windows.exe"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: soundboard-${{ env.TAG }}-windows.exe

  linux:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install PortAudio and Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1 libxkbcommon0 libxcb-cursor0 libgl1 libdbus-1-3
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group packaging
      - name: Bake Supabase config
        shell: python
        env:
          SOUNDBOARD_SUPABASE_URL: ${{ secrets.SOUNDBOARD_SUPABASE_URL }}
          SOUNDBOARD_SUPABASE_ANON_KEY: ${{ secrets.SOUNDBOARD_SUPABASE_ANON_KEY }}
        run: |
          import os
          from pathlib import Path

          url = os.environ["SOUNDBOARD_SUPABASE_URL"]
          key = os.environ["SOUNDBOARD_SUPABASE_ANON_KEY"]
          Path("src/soundboard/_baked_defaults.py").write_text(
              f"SUPABASE_URL = {url!r}\nSUPABASE_ANON_KEY = {key!r}\n"
          )
      - run: uv run pyinstaller packaging/linux/soundboard.spec
      - name: Assemble the AppImage
        run: |
          chmod +x packaging/linux/AppRun packaging/linux/build_appimage.sh
          packaging/linux/build_appimage.sh "soundboard-${{ env.TAG }}-linux-x86_64.AppImage"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: soundboard-${{ env.TAG }}-linux-x86_64.AppImage

  # Publishes the signed manifest the self-updater reads. Because it needs both builds,
  # its output only appears once the release is complete — which is exactly how the
  # updater tells a finished release from one whose binaries are still building, and how
  # a half-published release stays invisible to everyone.
  sign:
    runs-on: ubuntu-latest
    needs: [windows, linux]
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v5
      - name: Download the published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'soundboard-*'
      - name: Build and sign SHA256SUMS
        env:
          SIGNING_KEY: ${{ secrets.SOUNDBOARD_UPDATE_SIGNING_KEY }}
        run: |
          uv run --no-project --with cryptography python packaging/sign_release.py \
            "$TAG" \
            "soundboard-${TAG}-windows.exe" \
            "soundboard-${TAG}-linux-x86_64.AppImage" \
            --secret-key "$SIGNING_KEY"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            SHA256SUMS
            SHA256SUMS.sig
