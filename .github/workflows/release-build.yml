name: release-build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group packaging
      - name: Bake Supabase config
        shell: python
        env:
          SOUNDBOARD_SUPABASE_URL: ${{ secrets.SOUNDBOARD_SUPABASE_URL }}
          SOUNDBOARD_SUPABASE_ANON_KEY: ${{ secrets.SOUNDBOARD_SUPABASE_ANON_KEY }}
        run: |
          import os
          from pathlib import Path

          url = os.environ["SOUNDBOARD_SUPABASE_URL"]
          key = os.environ["SOUNDBOARD_SUPABASE_ANON_KEY"]
          Path("src/soundboard/_baked_defaults.py").write_text(
              f"SUPABASE_URL = {url!r}\nSUPABASE_ANON_KEY = {key!r}\n"
          )
      - run: uv run pyinstaller packaging/windows/soundboard.spec
      # Runs before the upload so a binary that cannot start is never published. The
      # cleared PATH is the whole point: a frozen bundle missing a Qt DLL still starts
      # on a machine that has PySide6 installed, because Windows resolves the import
      # from there. v0.4.1 shipped a prune verified exactly that way.
      - name: Smoke test the frozen binary
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:PATH = "$env:WINDIR\System32;$env:WINDIR"
          # Start-Process -Wait, not `& exe`: the binary is built --windowed, so the
          # call operator neither waits for it nor sets $LASTEXITCODE, and the check
          # compared an empty string against 0 and always threw.
          $cli = Start-Process -FilePath dist\soundboard.exe -ArgumentList devices `
            -PassThru -Wait
          if ($cli.ExitCode -ne 0) { throw "CLI entry point exited $($cli.ExitCode)" }
          $p = Start-Process -FilePath dist\soundboard.exe -PassThru
          Start-Sleep -Seconds 30
          if ($p.HasExited) {
            throw "GUI exited $($p.ExitCode) — the Qt/QML stack failed to load"
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "frozen binary starts and stays up with an empty PATH"
      - name: Rename artifact to the release asset name
        shell: bash
        run: mv dist/soundboard.exe "soundboard-${{ env.TAG }}-windows.exe"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: soundboard-${{ env.TAG }}-windows.exe

  linux:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install PortAudio and Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1 libxkbcommon0 libxcb-cursor0 libgl1 libdbus-1-3 xvfb
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group packaging
      - name: Bake Supabase config
        shell: python
        env:
          SOUNDBOARD_SUPABASE_URL: ${{ secrets.SOUNDBOARD_SUPABASE_URL }}
          SOUNDBOARD_SUPABASE_ANON_KEY: ${{ secrets.SOUNDBOARD_SUPABASE_ANON_KEY }}
        run: |
          import os
          from pathlib import Path

          url = os.environ["SOUNDBOARD_SUPABASE_URL"]
          key = os.environ["SOUNDBOARD_SUPABASE_ANON_KEY"]
          Path("src/soundboard/_baked_defaults.py").write_text(
              f"SUPABASE_URL = {url!r}\nSUPABASE_ANON_KEY = {key!r}\n"
          )
      - run: uv run pyinstaller packaging/linux/soundboard.spec
      - name: Assemble the AppImage
        run: |
          chmod +x packaging/linux/AppRun packaging/linux/build_appimage.sh
          packaging/linux/build_appimage.sh "soundboard-${{ env.TAG }}-linux-x86_64.AppImage"
      # Same reason as the Windows job. xvfb because pynput picks an X11 backend at import
      # time and raises without a display; extract-and-run because the runner has no FUSE.
      # The GUI deliberately runs on xcb rather than offscreen, so the platform and image
      # plugins are actually loaded and the check below has something to look at.
      - name: Smoke test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          APP="./soundboard-${{ env.TAG }}-linux-x86_64.AppImage"
          chmod +x "$APP"
          QT_QPA_PLATFORM=offscreen "$APP" devices
          QT_DEBUG_PLUGINS=1 xvfb-run -a "$APP" >qt.log 2>&1 &
          PID=$!
          sleep 30
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "AppImage exited early — the Qt/QML stack failed to load" >&2
            wait "$PID" || true
            cat qt.log >&2
            exit 1
          fi
          kill "$PID"
          # A grep that finds nothing proves nothing unless the log it read has the plugin
          # loader in it, so check the probe ran before trusting its silence.
          if ! grep -q "plugin.factoryloader" qt.log; then
            echo "QT_DEBUG_PLUGINS produced no plugin log — the check below never ran" >&2
            exit 1
          fi
          # A plugin whose Qt library packaging/qt_prune.py removed fails inside dlopen,
          # and Qt carries on without it — the app starts, stays up, and ships broken.
          # v0.4.3 went out with three of these. QT_DEBUG_PLUGINS is the only thing that
          # says so out loud, and on Linux the message names the library that is gone.
          #
          # There is no counterpart in the Windows job: that binary is built --windowed,
          # so it has no stdout or stderr to write this log to (Qt falls back to the
          # debugger), and the message there does not name the missing DLL anyway. What
          # covers Windows is tests/unit/test_packaging_qt_prune.py, which asserts both
          # file-name spellings of every pruned plugin.
          if grep -q "cannot load:.*libQt6" qt.log; then
            echo "a bundled Qt plugin lost its library to the prune:" >&2
            grep "cannot load:.*libQt6" qt.log >&2
            exit 1
          fi
          echo "AppImage starts, stays up, and every Qt plugin it ships can load"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: soundboard-${{ env.TAG }}-linux-x86_64.AppImage

  # Publishes the signed manifest the self-updater reads. Because it needs both builds,
  # its output only appears once the release is complete — which is exactly how the
  # updater tells a finished release from one whose binaries are still building, and how
  # a half-published release stays invisible to everyone.
  sign:
    runs-on: ubuntu-latest
    needs: [windows, linux]
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v5
      - name: Download the published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'soundboard-*'
      - name: Build and sign SHA256SUMS
        env:
          SIGNING_KEY: ${{ secrets.SOUNDBOARD_UPDATE_SIGNING_KEY }}
        run: |
          uv run --no-project --with cryptography python packaging/sign_release.py \
            "$TAG" \
            "soundboard-${TAG}-windows.exe" \
            "soundboard-${TAG}-linux-x86_64.AppImage" \
            --secret-key "$SIGNING_KEY"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            SHA256SUMS
            SHA256SUMS.sig
