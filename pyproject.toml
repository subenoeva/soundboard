[project]
name = "soundboard"
version = "0.1.0"
description = "Cross-platform soundboard that feeds clips and your microphone into a virtual input device"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
    "sounddevice>=0.5.5",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "platformdirs>=4.11.0",
]

[project.scripts]
soundboard = "soundboard.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soundboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not hardware'"
markers = [
    "hardware: requires a real audio device; deselected by default",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sounddevice.*", "soxr.*", "soundfile.*"]
ignore_missing_imports = true
